[workspace]
members = [
  "crates/clawin",
  "crates/clawin-bootstrap",
  "crates/clawin-commands",
  "crates/clawin-config",
  "crates/clawin-core",
  "crates/clawin-engine",
  "crates/clawin-integrations",
  "crates/clawin-platform",
  "crates/clawin-tools",
  "crates/clawin-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/GoyacJ/clawin"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
cargo_metadata = "0.23.1"
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
